# Cloudflare Worker for Foothold: serves the built Vue app and the /api routes (see docs/SERVER.md).
name = "foothold"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Keep variables added in the Cloudflare dashboard when deploying
keep_vars = true

# Build the app before every deploy (Cloudflare's build step runs only `wrangler deploy`).
# VITE_API_URL=self: this Worker serves the API too, so the app offers sign-in.
[build]
# On Cloudflare's own builds (WORKERS_CI=1) the tests run first, and a
# failing test stops the deploy. Locally (wrangler dev) it just builds.
command = "if [ -n \"$WORKERS_CI\" ]; then npx vitest run --dir test || exit 1; fi; VITE_API_URL=self npm run build"

# The built Vue app is served as static assets. Anything that isn't a file
# falls back to index.html so client-side routes work. /api goes to the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/l/*", "/g/*"]

[[d1_databases]]
binding = "DB"
database_name = "foothold"
database_id = "2e237cf8-a01f-4de1-841a-f852b9aa3b98"
migrations_dir = "migrations"

# Recorded ambience and music tracks, made once with ElevenLabs (worker/audioLibrary.js)
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "foothold-audio"

[vars]
FORMTRACK_URL = "https://formtrack.com.au"
APP_URL = "https://foothold.com.au"
# Sign-in, same Auth0 tenant as FormTrack. None of these are secret: the
# browser sees them anyway. AUTH0_CLIENT_ID is the "Foothold" SPA application.
AUTH0_DOMAIN = "dev-dprob3bsr0oj2dsz.us.auth0.com"
AUTH0_CLIENT_ID = "tgi72m6fOy0uAODE9vkjjlCy5TOGkpWx"
AUTH0_AUDIENCE = "https://api.formtrk.com"
# Local development only: ALLOW_DEVICE_IDS = "1" accepts an X-Device-Id header
# instead of a sign-in. Never set it in production.
# Extra origins allowed to call the API from a browser (comma separated),
# e.g. the GitHub Pages build. capacitor://localhost is the iPhone app and
# https://localhost the Android app.
ALLOWED_ORIGINS = "capacitor://localhost,https://localhost"
# Error reports (Sentry project "foothold"). A DSN is public: it only lets you send events.
# Usage analytics (src/lib/analytics.js): the project key is public. The PostHog
# project is shared with FormTrack; every Foothold event carries app = foothold.
POSTHOG_KEY = "phc_tvT3MiGWTANBMTDD9X6YMZSLjpZAH9qKc5gKocM9g7TX"
POSTHOG_HOST = "https://eu.i.posthog.com"
SENTRY_DSN = "https://34b2335cc58f419dce528ae16ce26d44@o4512309370486784.ingest.de.sentry.io/4512416830718032"
# Who can open the admin page at /app/admin (user ids, comma separated; worker/admin.js)
ADMIN_USERS = "62cda1ba-f5bf-4b55-a2f6-54460ba530e2"

# Secrets (set with `npx wrangler secret put NAME`):
#   TOKEN_KEY  any long random string; encrypts linked FormTrack tokens (AES-GCM)
#   ORS_API_KEY  Openrouteservice key for snapping planned routes to paths (or GOOGLE_ROUTES_KEY)
#   OPEN_METEO_KEY  optional, a paid Open-Meteo key for elevation charts once Foothold is commercial
#   ANTHROPIC_API_KEY  AI built plans (worker/aiplan.js); optional vars PLAN_MODEL, AI_DAILY_CAP_AUD (default 10)
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY  web push (worker/push.js); make a pair with `npm run vapid`
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET  Foothold Plus payments (docs/PAYMENTS.md); with vars
#     STRIPE_PRICE_PLUS, PLUS_PRICE_LABEL and the switch PREMIUM_ON = "1" (off until set)
#   FCM_SERVICE_ACCOUNT  the Firebase service account JSON, for push to the iPhone and Android apps

[triggers]
# Hourly: end finished battles and send "fading soon" reminders.
# Every 15 minutes: send waiting push notifications (worker/push.js).
crons = ["0 * * * *", "*/15 * * * *"]
