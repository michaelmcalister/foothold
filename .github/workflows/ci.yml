# Tests and the build on every pull request. Pushes to main are checked by
# Cloudflare's own build (wrangler.toml runs the tests before deploying)
# and by the Pages publish (deploy.yml).
name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --dir test
      - run: npm run build
