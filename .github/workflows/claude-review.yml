# AI code review on pull requests by Claude. Needs an ANTHROPIC_API_KEY
# repository secret (it skips quietly without one). Reviews when a pull request opens or leaves draft, not
# on every push (keeps the cost to cents). Ask for another look any time by
# commenting "@claude review this again".
# It comments only: CI decides what can merge, and you decide what does.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, Dependabot (no access to secrets) and pull requests from forks
    if: >-
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without an API key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to turn on Claude review."
      - uses: actions/checkout@v6
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read README.md and docs/ENGINE.md first.
            Look hardest at:
            - migrations/: anything that drops, renames or rewrites existing data
            - worker/: auth on new routes, backward compatible API responses for
              older iPhone app versions, no location tracks or personal data in logs
            - src/lib/engine/: territory rules stay deterministic and tested
            - bugs, missing tests for changed logic, and security problems
            Skip style nits the build would catch. Put specific problems as inline
            comments and finish with one short summary comment: what the change
            does, the risks, and whether it is ready to merge.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
